<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="Selector de mallas curriculares de Ingenieria Civil UCN.">
  <meta name="theme-color" content="#0F172A">
  <meta property="og:title" content="Mallas Ingenieria Civil UCN">
  <meta property="og:description" content="Elige la malla curricular Plan O o Plan P.">
  <meta property="og:type" content="website">
  <title>Mallas Ing. Civil UCN</title>
  <style>
    *, *::before, *::after { box-sizing: border-box; }
    :root {
      color-scheme: dark;
      --bg: #0f172a;
      --bg-soft: #111827;
      --surface: rgba(255,255,255,0.08);
      --surface-strong: rgba(255,255,255,0.13);
      --border: rgba(255,255,255,0.14);
      --text: #f8fafc;
      --muted: #94a3b8;
      --blue: #60a5fa;
      --pink: #f472b6;
      --green: #34d399;
      --amber: #f59e0b;
      --shadow: 0 24px 70px rgba(0,0,0,0.34);
    }
    html { min-height: 100%; }
    body {
      min-height: 100vh;
      margin: 0;
      font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      line-height: 1.5;
      color: var(--text);
      background:
        linear-gradient(115deg, rgba(96,165,250,0.20), transparent 38%),
        linear-gradient(245deg, rgba(244,114,182,0.16), transparent 42%),
        var(--bg);
      display: flex;
      flex-direction: column;
    }
    header {
      height: 58px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 0 24px;
      border-bottom: 1px solid rgba(255,255,255,0.08);
      background: rgba(15,23,42,0.72);
      backdrop-filter: blur(18px);
    }
    .brand {
      display: flex;
      align-items: baseline;
      gap: 12px;
      min-width: 0;
    }
    .brand strong {
      font-size: 0.95rem;
      letter-spacing: -0.01em;
      white-space: nowrap;
    }
    .brand span {
      color: var(--muted);
      font-size: 0.8rem;
      border-left: 1px solid rgba(255,255,255,0.14);
      padding-left: 12px;
      white-space: nowrap;
    }
    main {
      flex: 1;
      width: min(960px, calc(100% - 32px));
      margin: 0 auto;
      display: flex;
      align-items: center;
      padding: 42px 0;
    }
    .panel {
      width: 100%;
      display: grid;
      grid-template-columns: 0.9fr 1.1fr;
      gap: 28px;
      align-items: stretch;
    }
    .intro {
      padding: 26px 4px;
      display: flex;
      flex-direction: column;
      justify-content: center;
    }
    h1 {
      margin: 0;
      font-size: clamp(2rem, 4vw, 4rem);
      line-height: 0.98;
      letter-spacing: 0;
    }
    .plans {
      display: grid;
      gap: 14px;
    }
    .plan {
      position: relative;
      display: flex;
      align-items: center;
      justify-content: center;
      min-height: 220px;
      padding: 24px;
      text-decoration: none;
      color: var(--text);
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 8px;
      box-shadow: var(--shadow);
      overflow: hidden;
      transition: transform 160ms ease, background 160ms ease, border-color 160ms ease, box-shadow 160ms ease;
    }
    .plan:hover,
    .plan:focus-visible {
      transform: translateY(-2px);
      background: var(--surface-strong);
      border-color: rgba(255,255,255,0.28);
      box-shadow: 0 28px 78px rgba(0,0,0,0.42);
      outline: none;
    }
    .plan::before {
      content: "";
      position: absolute;
      inset: 0 auto 0 0;
      width: 4px;
      background: var(--accent);
    }
    .plan h2 {
      margin: 0;
      font-size: clamp(2.4rem, 4.8vw, 4.3rem);
      line-height: 1;
      letter-spacing: 0;
      text-align: center;
    }
    .plan__arrow {
      position: absolute;
      right: 22px;
      bottom: 22px;
      width: 46px;
      height: 46px;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      border-radius: 50%;
      color: var(--text);
      background: rgba(255,255,255,0.10);
      border: 1px solid rgba(255,255,255,0.16);
      box-shadow: 0 12px 28px rgba(0,0,0,0.18);
      transition: transform 160ms ease, background 160ms ease, border-color 160ms ease;
    }
    .plan__arrow svg {
      width: 22px;
      height: 22px;
      stroke-width: 2.4;
    }
    .plan:hover .plan__arrow,
    .plan:focus-visible .plan__arrow {
      transform: translateX(3px);
      background: color-mix(in srgb, var(--accent) 32%, rgba(255,255,255,0.12));
      border-color: color-mix(in srgb, var(--accent) 58%, rgba(255,255,255,0.22));
    }
    @media (max-width: 760px) {
      header { padding: 0 16px; }
      .brand { align-items: start; flex-direction: column; gap: 0; }
      .brand span { border-left: 0; padding-left: 0; font-size: 0.72rem; }
      main { align-items: start; padding: 24px 0 32px; }
      .panel { grid-template-columns: 1fr; gap: 18px; }
      .intro { padding: 12px 0 2px; }
      .plan { min-height: 190px; padding: 20px; }
      .plan__arrow { width: 42px; height: 42px; right: 18px; bottom: 18px; }
    }
  </style>
</head>
<body>
  <header>
    <div class="brand">
      <strong>Universidad Catolica del Norte</strong>
      <span>Ingenieria Civil</span>
    </div>
  </header>

  <main>
    <section class="panel" aria-label="Selector de mallas">
      <div class="intro">
        <h1>Mallas curriculares</h1>
      </div>

      <div class="plans">
        <a class="plan" href="./malla-o.html" style="--accent: var(--blue)" aria-label="Abrir malla Plan O">
          <h2>Plan O</h2>
          <span class="plan__arrow" aria-hidden="true">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round">
              <path d="M5 12h14"></path>
              <path d="m13 6 6 6-6 6"></path>
            </svg>
          </span>
        </a>

        <a class="plan" href="./malla-p.html" style="--accent: var(--pink)" aria-label="Abrir malla Plan P">
          <h2>Plan P</h2>
          <span class="plan__arrow" aria-hidden="true">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round">
              <path d="M5 12h14"></path>
              <path d="m13 6 6 6-6 6"></path>
            </svg>
          </span>
        </a>
      </div>
    </section>
  </main>
</body>
</html>
